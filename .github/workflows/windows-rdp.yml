name: Windows Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Test Windows Runner
        shell: pwsh
        run: |
          Write-Host "Windows runner is working!"
          Write-Host "Computer: $env:COMPUTERNAME"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
